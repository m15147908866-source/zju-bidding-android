name: 功能建议
description: 新的叫牌体系、界面改进或交互调整
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 说清使用场景，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      options:
        - 叫牌数据 / 体系规则
        - 叫牌引擎
        - 界面与交互
        - Android 壳 / 打包
        - 其他
    validations:
      required: true

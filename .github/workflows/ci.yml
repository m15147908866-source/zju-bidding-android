name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS 语法检查
        run: |
          for f in ./*.js; do
            echo "检查 $f"
            node --check "$f"
          done

      - name: manifest.json 校验
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.json','utf8'))"

      - name: 版本一致性校验（VERSION / AndroidManifest / sw.js）
        run: node scripts/set-version.mjs --check

  build-apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 安装构建所需 SDK 组件
        run: sdkmanager "platforms;android-34" "build-tools;36.0.0"

      - name: 构建
        run: bash android/build.sh
        env:
          OUT_APK: ${{ runner.temp }}/ZJU-bidding.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZJU-bidding-apk
          path: ${{ runner.temp }}/ZJU-bidding.apk
          retention-days: 7

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: JS 语法检查
        run: |
          for f in ./*.js core/*.js; do
            echo "检查 $f"
            node --check "$f"
          done

      - name: manifest.json 校验
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.json','utf8'))"

      - name: 版本一致性校验（VERSION / AndroidManifest / sw.js）
        run: node scripts/set-version.mjs --check

  verify:
    name: 规则与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # core/*.test.js 用 node:test 编写，无依赖；文件列表由 shell 展开后传给 node。
      - name: 单元测试
        run: node --test core/*.test.js

      - name: 规则数据校验（结构 / 语境可达 / 同叫品唯一）
        run: node scripts/validate-rules.mjs

      - name: 引擎适配层冒烟
        run: node scripts/smoke-engine.mjs

      - name: 资源引用一致性
        run: node scripts/check-assets.mjs

      # data/ 是生成物：迁移 + 打包后必须与仓库内容一致，否则说明提交的数据是旧的。
      - name: 生成物与源数据一致
        run: |
          node scripts/migrate-legacy.mjs
          node scripts/build-data.mjs
          if ! git diff --exit-code -- data/; then
            echo "::error::data/ 与源数据不一致。请在本地跑 node scripts/migrate-legacy.mjs && node scripts/build-data.mjs 后一起提交。"
            exit 1
          fi

  build-apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # runner 自带 Android SDK，但 sdkmanager 不一定在 PATH 上，这里显式定位。
      # 不用 setup-android：它会尝试安装已从 SDK 仓库下线的 tools 包。
      - name: 安装构建所需 SDK 组件
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if command -v sdkmanager > /dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(ls -1d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"
          fi
          echo "使用 $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;36.0.0"

      - name: 构建
        run: bash android/build.sh
        env:
          OUT_APK: ${{ runner.temp }}/ZJU-bidding.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZJU-bidding-apk
          path: ${{ runner.temp }}/ZJU-bidding.apk
          retention-days: 7

  # 汇总成唯一必需检查：ruleset 里只要求 ci-success，新增子任务时不用改保护规则。
  ci-success:
    name: ci-success
    needs: [static-checks, verify, build-apk]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 汇总结果
        env:
          STATIC: ${{ needs.static-checks.result }}
          VERIFY: ${{ needs.verify.result }}
          BUILD: ${{ needs.build-apk.result }}
        run: |
          echo "静态检查：$STATIC"
          echo "规则与测试：$VERIFY"
          echo "构建 APK：$BUILD"
          if [ "$STATIC" != "success" ] || [ "$VERIFY" != "success" ] || [ "$BUILD" != "success" ]; then
            echo "::error::CI 未全部通过"
            exit 1
          fi

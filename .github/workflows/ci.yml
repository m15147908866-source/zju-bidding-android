name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS 语法检查
        run: |
          for f in ./*.js; do
            echo "检查 $f"
            node --check "$f"
          done

      - name: manifest.json 校验
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.json','utf8'))"

      - name: 版本一致性校验（VERSION / AndroidManifest / sw.js）
        run: node scripts/set-version.mjs --check

  build-apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # runner 自带 Android SDK，但 sdkmanager 不一定在 PATH 上，这里显式定位。
      # 不用 setup-android：它会尝试安装已从 SDK 仓库下线的 tools 包。
      - name: 安装构建所需 SDK 组件
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if command -v sdkmanager > /dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(ls -1d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"
          fi
          echo "使用 $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;36.0.0"

      - name: 构建
        run: bash android/build.sh
        env:
          OUT_APK: ${{ runner.temp }}/ZJU-bidding.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZJU-bidding-apk
          path: ${{ runner.temp }}/ZJU-bidding.apk
          retention-days: 7

  # 汇总成唯一必需检查：ruleset 里只要求 ci-success，新增子任务时不用改保护规则。
  ci-success:
    name: ci-success
    needs: [static-checks, build-apk]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 汇总结果
        env:
          STATIC: ${{ needs.static-checks.result }}
          BUILD: ${{ needs.build-apk.result }}
        run: |
          echo "静态检查：$STATIC"
          echo "构建 APK：$BUILD"
          if [ "$STATIC" != "success" ] || [ "$BUILD" != "success" ]; then
            echo "::error::CI 未全部通过"
            exit 1
          fi

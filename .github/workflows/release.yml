name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # runner 自带 Android SDK，但 sdkmanager 不一定在 PATH 上，这里显式定位。
      # 不用 setup-android：它会尝试安装已从 SDK 仓库下线的 tools 包。
      - name: 安装构建所需 SDK 组件
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if command -v sdkmanager > /dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(ls -1d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"
          fi
          echo "使用 $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;36.0.0"

      - name: 校验 tag 与 VERSION 一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(cat VERSION)"
          if [ "$tag" != "$ver" ]; then
            echo "tag v$tag 与 VERSION ($ver) 不一致" >&2
            exit 1
          fi

      - name: 还原签名密钥
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: 构建
        env:
          OUT_APK: ${{ github.workspace }}/dist/ZJU-bidding.apk
          KEYSTORE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，将使用临时调试密钥签名，产物无法覆盖安装历史版本"
          fi
          bash android/build.sh

      - name: 生成发布说明
        run: |
          ver="$(cat VERSION)"
          sha="$(sha256sum dist/ZJU-bidding.apk | cut -d' ' -f1)"
          {
            echo "## 安装"
            echo
            echo "- 版本：\`$ver\`（versionCode $(grep -o 'versionCode=\"[0-9]*\"' android/AndroidManifest.xml | grep -o '[0-9]*')）"
            echo "- 适用：Android 6.0 (API 23) 及以上"
            echo "- SHA256：\`$sha\`"
            echo
            if [ -n "$KEYSTORE_B64" ]; then
              echo "本版本使用项目发布密钥签名。"
            else
              echo "> 本版本使用临时调试密钥签名，与历史安装包签名不同，覆盖安装前请先卸载旧版。"
            fi
            echo
            echo "## 变更"
            echo
            awk -v v="$ver" '
              $0 ~ "^## \\[" v "\\]" { f = 1; next }
              f && /^## \[/ { exit }
              f && /^\[[^]]+\]: / { exit }
              f { print }
            ' CHANGELOG.md
          } > "$RUNNER_TEMP/notes.md"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ZJU-bidding.apk \
            --title "ZJU 叫牌 ${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md"
